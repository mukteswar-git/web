<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Two Column with Flexbox</title>
  <style>
    .container {
      display: flex;
      gap: 20px;
      padding: 20px;
    }

    .column {
      flex: 1;
      padding: 20px;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h2>🧱 Two-Column Layout</h2>
  <div class="container">
    <div class="column">📗 Left Column Content</div>
    <div class="column">📘 Right Column Content</div>
  </div>
</body>
</html>

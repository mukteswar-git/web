<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox Centering</title>
  <style>
    .center-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80vh;
      background-color: #eee;
    }

    .center-box {
      padding: 40px;
      background-color: #8cc0de;
      border-radius: 10px;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h2>🎯 Centering an Element</h2>
  <div class="center-container">
    <div class="center-box">I'm centered!</div>
  </div>
</body>
</html>
